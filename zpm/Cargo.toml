[package]
name = "zpm"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "ZPM, the Zodiac Package Manager (host-side client)"
license = "MIT"

[dependencies]
clap = { version = "4", features = ["derive"] }
ed25519-dalek = "2"
flate2 = "1"
hex = "0.4"
semver = { version = "1", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tar = "0.4"
thiserror = "1"
toml = "0.8"
ureq = "2"

[dev-dependencies]
tempfile = "3"