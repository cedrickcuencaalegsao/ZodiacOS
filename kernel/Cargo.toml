[package]
name    = "zodic_os"
version = "0.1.1"
edition = "2024"

[lib]
name       = "zodiac_os"
crate-type = ["staticlib"]
test       = false
bench      = false

[profile.dev]
panic     = "abort"
opt-level = 1

[profile.release]
opt-level = "z"        # try "z" if you need more
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[dependencies]
sha2 = { version = "0.10", default-features = false }
spin = { version = "0.9", default-features = false, features = ["mutex", "spin_mutex"] }
linked_list_allocator = "0.10"
hmac = { version = "0.12", default-features = false}
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"]}
sha1 = { version = "0.10", default-features = false}
login-manager = { path = "../userspace/login-manager" }
zodiac-desktop = { path = "../userspace/desktop" }
zpm_core = { path = "zpm_core" }
errors = { path = "errors" }
shared = { path = "shared" }
zedit = { path = "../packages/zedit" }

[workspace]
members = ["errors", "shared", "zpm_core"]
