[package]
name    = "zodic_os"
version = "0.1.1"
edition = "2024"

[lib]
name       = "zodiac_os"
crate-type = ["staticlib"]
test       = false
bench      = false

[profile.dev]
panic     = "abort"
opt-level = 1

[profile.release]
panic         = "abort"
opt-level     = "s"
lto           = true
codegen-units = 1

[dependencies]
login-manager = { path = "../userspace/login-manager" }
zodiac-desktop = { path = "../userspace/desktop" }
sha2 = { version = "0.10", default-features = false }