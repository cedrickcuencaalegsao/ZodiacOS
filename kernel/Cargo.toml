[package]
name    = "zodic_os"
version = "0.1.0"
edition = "2024"

[lib]
name       = "zodiac_os"
crate-type = ["staticlib"]
test       = false
bench      = false

[profile.dev]
panic     = "abort"
opt-level = 1

[profile.release]
panic         = "abort"
opt-level     = "s"
lto           = true
codegen-units = 1

