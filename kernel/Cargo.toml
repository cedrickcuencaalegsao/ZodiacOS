[package]
name    = "zodic_os"
version = "0.1.1"
edition = "2024"

[lib]
name       = "zodiac_os"
crate-type = ["staticlib"]
test       = false
bench      = false

[profile.dev]
panic     = "abort"
opt-level = 1

[profile.release]
panic         = "abort"
opt-level     = "s"
lto           = true
codegen-units = 1

[dependencies]
sha2 = { version = "0.10", default-features = false }
spin = { version = "0.9", default-features = false, features = ["mutex", "spin_mutex"] }
hmac = { version = "0.12", default-features = false}
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"]}
sha1 = { version = "0.10", default-features = false}
login-manager = { path = "../userspace/login-manager" }
zodiac-desktop = { path = "../userspace/desktop" }
zpm-core = { path = "../zpm/core" }
errors = { path = "errors" }

[workspace]
members = ["errors"]
